<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو هاني - قائمة الطلبات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* 1. الهوية البصرية: قوس قزح زجاجي */
        :root {
            --glass: rgba(255, 255, 255, 0.9);
            --accent: #6c5ce7;
            --rainbow: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb, #8fd3f4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma;
            background: var(--rainbow); background-size: 400% 400%;
            animation: rainbowBG 15s ease infinite;
            min-height: 100vh; padding: 15px;
        }
        @keyframes rainbowBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .container { max-width: 500px; margin: 0 auto; }

        /* 2. تصميم البطاقات المربعة (Grid) */
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px;
        }

        .card {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 15px; text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .card:active { transform: scale(0.95); }
        .card i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        .card h4 { font-size: 0.9rem; color: #333; margin-bottom: 5px; }
        .card .price { color: #2ecc71; font-weight: bold; font-size: 0.85rem; }

        /* 3. شاشة الدخول الاحترافية */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5); text-align: center;
        }

        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #ddd; outline: none; background: rgba(255,255,255,0.5);
        }

        .btn-main {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--accent); color: white; font-weight: bold; cursor: pointer;
        }

        /* 4. السلة العائمة */
        .floating-cart {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: #2d3436; color: white; border-radius: 15px;
            padding: 15px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000; display: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="glass-panel">
        <i class="fas fa-shopping-basket fa-3x" style="color:var(--accent); margin-bottom:15px;"></i>
        <h2>مرحباً بك في قهوة البلة</h2>
        <p style="font-size: 0.9rem; color: #666;">يرجى تزويدنا ببياناتك لخدمتك بشكل أفضل</p>
        <input type="text" id="cust-name" placeholder="الاسم الكريم">
        <input type="tel" id="cust-phone" placeholder="رقم الموبايل">
        <button class="btn-main" onclick="startOrder()">بدء الطلب</button>
    </div>

    <div id="menu-screen" class="hidden">
        <div class="glass-panel" style="margin-bottom: 15px; padding: 15px;">
            <h3 id="welcome-msg"></h3>
            <div id="db-indicator" style="font-size: 0.7rem; color: #2ecc71;">● المتجر متصل الآن</div>
        </div>

        <div id="category-list" class="grid-container">
            </div>

        <div id="product-list" class="grid-container hidden">
            <button class="btn-main" style="grid-column: span 2; background:#636e72;" onclick="showCats()">⬅ رجوع للأقسام</button>
            </div>
    </div>
</div>

<div id="cart-bar" class="floating-cart" onclick="goToCheckout()">
    <div>
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-qty" style="margin-right:10px;">0 منتجات</span>
    </div>
    <div id="cart-total">0 ل.س</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://abuhaniapp-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = null;
    let cart = [];
    let products = {};

    // بدء الطلب
    function startOrder() {
        const n = document.getElementById('cust-name').value;
        const p = document.getElementById('cust-phone').value;
        if(!n || !p) return Swal.fire('عذراً', 'يرجى إكمال بياناتك يا غالي', 'warning');
        
        user = { name: n, phone: p };
        document.getElementById('welcome-msg').innerText = "أهلاً بك يا " + n;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
        loadMenu();
    }

    // تحميل المنيو (أقسام ومنتجات)
    function loadMenu() {
        // تحميل الأقسام كمربعات
        db.ref('categories').on('value', snap => {
            const container = document.getElementById('category-list');
            container.innerHTML = "";
            snap.forEach(child => {
                const cat = child.val();
                container.innerHTML += `
                    <div class="card" onclick="loadProducts('${child.key}')">
                        <i class="fas fa-folder-open"></i>
                        <h4>${cat.name}</h4>
                    </div>
                `;
            });
        });

        // تحميل المنتجات في الخلفية
        db.ref('products').on('value', snap => { products = snap.val() || {}; });
    }

    function loadProducts(catId) {
        document.getElementById('category-list').classList.add('hidden');
        const container = document.getElementById('product-list');
        container.classList.remove('hidden');
        
        // مسح المنتجات القديمة باستثناء زر الرجوع
        const backBtn = container.firstElementChild;
        container.innerHTML = "";
        container.appendChild(backBtn);

        Object.keys(products).forEach(id => {
            const p = products[id];
            if(String(p.categoryId) === String(catId)) {
                container.innerHTML += `
                    <div class="card" onclick="addToCart('${id}', '${p.name}', ${p.price})">
                        <i class="fas fa-coffee"></i>
                        <h4>${p.name}</h4>
                        <div class="price">${p.price.toLocaleString()} ل.س</div>
                        <button style="margin-top:5px; border:none; background:var(--accent); color:white; border-radius:10px; padding:5px 10px; font-size:0.7rem;">+ إضافة</button>
                    </div>
                `;
            }
        });
    }

    function showCats() {
        document.getElementById('product-list').classList.add('hidden');
        document.getElementById('category-list').classList.remove('hidden');
    }

    function addToCart(id, name, price) {
        cart.push({id, name, price});
        updateCartUI();
        Swal.fire({
            title: 'تمت الإضافة',
            text: `أضفنا ${name} إلى سلتك`,
            icon: 'success',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 1500
        });
    }

    function updateCartUI() {
        const bar = document.getElementById('cart-bar');
        if(cart.length > 0) {
            bar.style.display = 'flex';
            document.getElementById('cart-qty').innerText = cart.length + " منتجات";
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = total.toLocaleString() + " ل.س";
        }
    }

    function goToCheckout() {
        // هنا يتم الانتقال لصفحة الدفع وإرسال الطلب كما في كودك الأصلي
        Swal.fire('جاهز؟', 'سيتم توجيهك لإنهاء الطلب والدفع عبر شام كاش', 'info');
    }
</script>
</body>
</html>
