<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب أونلاين - مقهى أبو هاني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo'; }
        body { background: linear-gradient(145deg, #1a1a2e, #16213e); padding: 20px; color: white; }
        .header { background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); border-radius: 30px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 15px; }
        .product { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 12px; text-align: center; cursor: pointer; transition:0.2s; }
        .product:active { transform: scale(0.96); }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f1a; padding: 12px 20px; display: flex; justify-content: space-between; z-index: 1000; border-top: 2px solid gold; }
        button { background: #f39c12; border: none; padding: 8px 24px; border-radius: 40px; font-weight: bold; }
        .drive-btn { background: #2c3e50; color: white; margin-left: 10px; }
    </style>
</head>
<body>
<div class="header">
    <h2><i class="fas fa-store"></i> مقهى وسوبر ماركت أبو هاني</h2>
    <p>اختر منتجك، أضفه للسلة، ثم أتم الدفع</p>
    <button id="driveThruModeBtn" class="drive-btn"><i class="fas fa-car"></i> وضع الدليفري (للموظفين)</button>
</div>
<div id="productsGrid" class="grid">جاري التحميل...</div>

<div id="cartBar" class="cart-bar" style="display: none;">
    <span><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span> عناصر</span>
    <span><span id="cartTotal">0</span> ل.س</span>
    <button id="checkoutBtn"><i class="fas fa-credit-card"></i> إتمام الطلب</button>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    let products = [];
    let cart = JSON.parse(localStorage.getItem('customerCart')) || [];
    let isDriveThruMode = false;  // تحويل للجارسون
    
    function renderProducts() {
        const container = document.getElementById('productsGrid');
        if(!products.length) { container.innerHTML = '<p>لا توجد منتجات</p>'; return; }
        container.innerHTML = products.map(p => `
            <div class="product" data-id="${p.id}">
                <i class="fas fa-mug-hot" style="font-size:2rem"></i>
                <div>${p.name}</div>
                <div style="color:gold">${p.price} ل.س</div>
            </div>
        `).join('');
        document.querySelectorAll('.product').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.dataset.id;
                const product = products.find(p=>p.id==id);
                addToCart(product);
            });
        });
    }
    
    function addToCart(product) {
        const existing = cart.find(i=>i.id==product.id);
        if(existing) existing.qty++;
        else cart.push({...product, qty:1});
        localStorage.setItem('customerCart', JSON.stringify(cart));
        updateCartUI();
        Swal.fire({ icon:'success', title:'تمت الإضافة', text:`${product.name}`, timer:800, showConfirmButton:false });
    }
    
    function updateCartUI() {
        const total = cart.reduce((a,b)=>a+(b.price*b.qty),0);
        const count = cart.reduce((a,b)=>a+b.qty,0);
        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = total;
        document.getElementById('cartBar').style.display = count ? 'flex' : 'none';
    }
    
    document.getElementById('checkoutBtn').addEventListener('click', async () => {
        if(!cart.length) return;
        const total = cart.reduce((a,b)=>a+(b.price*b.qty),0);
        const { value: customerName } = await Swal.fire({ title: 'اسمك (للاستلام)', input: 'text', inputPlaceholder: 'أدخل اسمك' });
        const source = isDriveThruMode ? 'drive_thru' : 'online';
        const orderRef = push(ref(db, 'orders'));
        await set(orderRef, {
            items: cart,
            total: total,
            status: 'pending_payment',
            source: source,
            paymentMethod: 'sham_cash',
            customerName: customerName || 'زائر',
            timestamp: Date.now(),
            createdBy: isDriveThruMode ? 'waiter' : 'customer'
        });
        localStorage.removeItem('customerCart');
        cart = [];
        updateCartUI();
        Swal.fire('تم إرسال الطلب', 'يرجى دفع المبلغ عبر شام كاش وإرفاق الإيصال بالنظام.', 'success');
    });
    
    document.getElementById('driveThruModeBtn').addEventListener('click', () => {
        isDriveThruMode = !isDriveThruMode;
        document.getElementById('driveThruModeBtn').style.background = isDriveThruMode ? '#e67e22' : '#2c3e50';
        Swal.fire(isDriveThruMode ? 'وضع الدليفري مفعل' : 'وضع العميل العادي', isDriveThruMode ? 'الآن أنت تعمل كجارسون (دليفري)' : 'الآن أنت تطلب كزبون عادي', 'info');
    });
    
    // تحميل المنتجات
    onValue(ref(db,'products'), (snap) => {
        if(snap.exists()) {
            products = Object.entries(snap.val()).map(([id,val])=>({id,...val}));
            renderProducts();
        }
    });
    updateCartUI();
</script>
</body>
</html>
